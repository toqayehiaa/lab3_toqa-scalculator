<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toqa's Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="calculator">
      <h1>Toqa's Calculator</h1>

      <div id="display" class="display">0</div>

      <div id="buttons" class="buttons">
        <button class="gray" data-action="clear">AC</button>
        <button class="dark" data-number="00">00</button>
        <button class="dark" data-action="percent">%</button>
        <button class="orange" data-operator="/">&divide;</button>

        <button class="dark" data-number="7">7</button>
        <button class="dark" data-number="8">8</button>
        <button class="dark" data-number="9">9</button>
        <button class="orange" data-operator="*">&times;</button>

        <button class="dark" data-number="4">4</button>
        <button class="dark" data-number="5">5</button>
        <button class="dark" data-number="6">6</button>
        <button class="orange" data-operator="-">&minus;</button>

        <button class="dark" data-number="1">1</button>
        <button class="dark" data-number="2">2</button>
        <button class="dark" data-number="3">3</button>
        <button class="orange" data-operator="+">+</button>

        <button class="dark zero" data-number="0">0</button>
        <button class="dark" data-number=".">.</button>
        <button class="orange" data-action="equals">=</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
